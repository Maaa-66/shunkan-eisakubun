<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fde">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="瞬間英作文">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>瞬間英作文</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  color-scheme: light dark;
  --bg:#f3f6fb; --card:#ffffff; --text:#18212e; --muted:#667386; --line:#dbe3ee;
  --accent:#2f6fde; --on-accent:#ffffff; --accent-soft:#e8f0fe;
  --good:#1f9d63; --on-good:#ffffff;
  --again:#d6473f; --on-again:#ffffff;
  --shadow:0 1px 2px rgba(20,40,80,.06), 0 10px 28px rgba(20,40,80,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e141c; --card:#171f2a; --text:#e9eff7; --muted:#94a2b4; --line:#273240;
    --accent:#6ea2ff; --on-accent:#0b1626; --accent-soft:#1b2a44;
    --good:#4cc790; --on-good:#06231a;
    --again:#ff7a72; --on-again:#2a0d0b;
    --shadow:none;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%; margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  line-height:1.6; touch-action:manipulation; overscroll-behavior:none;
}
button,select,input{font:inherit; color:inherit}
button{cursor:pointer}
#app{
  max-width:600px; margin:0 auto; min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 6px) 16px calc(env(safe-area-inset-bottom) + 12px);
}
header{display:flex; align-items:center; gap:10px; padding:8px 0 10px}
header .title{font-weight:700; font-size:1.05rem; letter-spacing:.02em}
header .count{margin-left:auto; color:var(--muted); font-size:.9rem; font-variant-numeric:tabular-nums}
.icon-btn{
  width:40px; height:40px; border-radius:12px; border:1px solid var(--line);
  background:var(--card); font-size:1.15rem; line-height:1; display:grid; place-items:center;
}
.bar{height:4px; background:var(--line); border-radius:4px; overflow:hidden}
.bar i{display:block; height:100%; width:0; background:var(--accent); border-radius:4px; transition:width .25s ease}

main{
  flex:1; margin-top:14px; background:var(--card); border-radius:22px; box-shadow:var(--shadow);
  padding:20px 18px; display:flex; flex-direction:column; gap:16px; min-height:0; overflow-y:auto;
}
.meta{display:flex; align-items:center; gap:8px; color:var(--muted); font-size:.78rem}
.meta .chip{padding:2px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-weight:600}
.meta .state{margin-left:auto; font-weight:700}
.meta .state.ok{color:var(--good)} .meta .state.again{color:var(--again)}
.qlabel{font-size:.78rem; color:var(--muted); margin:2px 0 -8px}
.ja{margin:0; font-size:1.42rem; font-weight:650; line-height:1.55; word-break:break-word}

.answer{
  border:2px dashed var(--line); border-radius:16px; min-height:104px; padding:16px;
  display:grid; place-items:center; text-align:center; color:var(--muted); cursor:pointer; user-select:none;
}
.answer.revealed{
  border:2px solid var(--accent); background:var(--accent-soft); color:var(--text);
  place-items:start; text-align:left; cursor:default; user-select:text;
}
.answer .en{
  margin:0 0 10px; font-size:1.28rem; font-weight:650; line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; word-break:break-word;
}
.pill{
  display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:999px;
  border:1px solid var(--line); background:var(--card); font-size:.9rem; font-weight:600;
}
.pill:active{transform:scale(.97)}
.hint-btn{align-self:flex-start; color:var(--muted)}
.hint{
  background:var(--bg); border-radius:14px; padding:12px 14px; display:flex; gap:12px; align-items:center;
}
.hint .txt{flex:1; min-width:0}
.hint .hen{font-weight:700; font-size:1.08rem; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; word-break:break-word}
.hint .hja{color:var(--muted); font-size:.9rem}

footer{display:grid; gap:10px; padding-top:14px}
.row{display:grid; gap:10px; grid-template-columns:1fr 1fr}
.row.one{grid-template-columns:1fr}
.btn{min-height:56px; border:0; border-radius:16px; font-size:1.05rem; font-weight:700}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent); color:var(--on-accent)}
.btn.good{background:var(--good); color:var(--on-good)}
.btn.again{background:var(--again); color:var(--on-again)}
.row.sec{grid-template-columns:1fr 1fr 1fr}
.row.sec button{background:transparent; border:0; color:var(--muted); font-size:.92rem; min-height:40px; font-weight:600}
[hidden]{display:none !important}

/* 設定シート */
.backdrop{position:fixed; inset:0; background:rgba(8,14,24,.5); z-index:10}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:11; max-width:600px; margin:0 auto;
  background:var(--card); border-radius:22px 22px 0 0; padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);
  max-height:88vh; max-height:88dvh; overflow-y:auto; box-shadow:0 -10px 40px rgba(0,0,0,.25);
}
.sheet h2{margin:0 0 6px; font-size:1.1rem}
.field{display:grid; gap:6px; padding:12px 0; border-bottom:1px solid var(--line)}
.field:last-of-type{border-bottom:0}
.field label,.field .lab{font-size:.85rem; color:var(--muted); font-weight:600}
.field select,.field input[type=number]{
  width:100%; min-height:44px; padding:8px 12px; border-radius:12px; border:1px solid var(--line); background:var(--bg);
}
.inline{display:flex; gap:10px; align-items:center}
.inline input{flex:1}
.switch{display:flex; justify-content:space-between; align-items:center; gap:12px}
.switch input{width:22px; height:22px; accent-color:var(--accent)}
.small-btn{min-height:44px; padding:0 16px; border-radius:12px; border:1px solid var(--line); background:var(--bg); font-weight:600}
.stats{font-size:.95rem}
.danger{color:var(--again)}
.close{width:100%; margin-top:10px}
.toast{
  position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 150px); transform:translateX(-50%);
  background:var(--text); color:var(--bg); padding:10px 16px; border-radius:12px; font-size:.9rem; z-index:20;
  max-width:88vw; text-align:center; opacity:0; pointer-events:none; transition:opacity .2s;
}
.toast.show{opacity:.95}
.empty{padding:30px 6px; color:var(--muted); text-align:center}
@media (min-height:760px){ .ja{font-size:1.55rem} }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">瞬間英作文</div>
    <div class="count" id="pos">– / –</div>
    <button class="icon-btn" id="btnSettings" aria-label="設定">⚙</button>
  </header>
  <div class="bar" aria-hidden="true"><i id="barFill"></i></div>

  <main id="card">
    <div id="cardBody" style="display:contents">
      <div class="meta"><span class="chip" id="chip"></span><span id="num"></span><span class="state" id="state"></span></div>
      <div class="qlabel">日本語を、英語にしてみよう</div>
      <p class="ja" id="ja"></p>

      <section class="answer" id="answerBox" role="button" tabindex="0" aria-live="polite">
        <span id="placeholder">タップして答えを見る</span>
        <div id="answerContent" hidden>
          <p class="en" id="en"></p>
          <button class="pill" id="btnSpeak" type="button">🔊 もう一度聞く</button>
        </div>
      </section>

      <button class="pill hint-btn" id="btnHint" type="button" aria-expanded="false">💡 ヒント(フレーズ)を見る</button>
      <div class="hint" id="hintBox" hidden>
        <div class="txt"><div class="hen" id="hintEn"></div><div class="hja" id="hintJa"></div></div>
        <button class="icon-btn" id="btnSpeakHint" type="button" aria-label="フレーズを読み上げ">🔊</button>
      </div>
    </div>
    <div class="empty" id="empty" hidden>この条件に当てはまる問題はありません。<br>⚙ から条件を変えてください。</div>
  </main>

  <footer>
    <div class="row one" id="rowBefore"><button class="btn primary" id="btnReveal" type="button">答えを見る</button></div>
    <div class="row" id="rowAfter" hidden>
      <button class="btn again" id="btnAgain" type="button">↺ もう一度</button>
      <button class="btn good" id="btnOk" type="button">✓ できた</button>
    </div>
    <div class="row sec">
      <button id="btnPrev" type="button">← 前へ</button>
      <button id="btnSpeakAns" type="button">🔊 英文を聞く</button>
      <button id="btnSkip" type="button">スキップ →</button>
    </div>
  </footer>
</div>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="設定" hidden>
  <h2>設定</h2>
  <div class="field"><label for="selRange">範囲</label>
    <select id="selRange">
      <option value="all">すべて</option>
      <option value="g0">句動詞・熟語</option>
      <option value="g1">名詞句</option>
    </select></div>
  <div class="field"><label for="selFilter">出題する問題</label>
    <select id="selFilter">
      <option value="all">すべて</option>
      <option value="todo">まだ「できた」にしていない問題</option>
      <option value="again">「もう一度」にした問題だけ</option>
    </select></div>
  <div class="field"><label for="selOrder">順番</label>
    <select id="selOrder">
      <option value="seq">番号順</option>
      <option value="random">ランダム</option>
    </select></div>
  <div class="field"><span class="lab">音声</span>
    <div class="switch"><span>答えを見たら自動で読み上げる</span><input type="checkbox" id="chkAuto"></div>
    <label for="selRate">読み上げの速さ</label>
    <select id="selRate">
      <option value="0.7">ゆっくり</option>
      <option value="0.85">少しゆっくり</option>
      <option value="1">ふつう</option>
      <option value="1.15">少し速い</option>
    </select>
    <label for="selVoice">声</label>
    <select id="selVoice"><option value="">自動(おすすめ)</option></select>
    <button class="small-btn" id="btnTestVoice" type="button">🔊 声を試す</button>
  </div>
  <div class="field"><label for="inpJump">番号へ移動(1〜<span id="maxNum"></span>)</label>
    <div class="inline"><input type="number" id="inpJump" inputmode="numeric" min="1"><button class="small-btn" id="btnJump" type="button">移動</button></div></div>
  <div class="field"><span class="lab">進捗</span><div class="stats" id="stats"></div>
    <button class="small-btn danger" id="btnReset" type="button">進捗をリセット</button></div>
  <button class="btn primary close" id="btnClose" type="button">閉じる</button>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
// [フレーズ(英), フレーズ(日), 例文(日), 例文(英)]
const DATA = [["build up (my ability)","(力を)つける、築き上げる","毎日の練習で、英語力をつけたいです。","I want to build up my English ability through daily practice."],["get in touch with (someone overseas)","(海外の人)と連絡を取る","海外にいる友人と連絡を取りました。","I got in touch with a friend who lives overseas."],["give up / without giving up","諦める/諦めずに","私は諦めずに、勉強を続けました。","I kept studying without giving up."],["keep going (without excessive strain)","(無理なく)続けていく","私は無理なく、毎日続けています。","I keep going without too much strain."],["keep going little by little","少しずつ続ける","少しずつ続けることが大切です。","It is important to keep going little by little."],["keep in touch with (people far away)","(遠くの人)と連絡を取り合う","私は遠くに住む友人と連絡を取り合っています。","I keep in touch with friends who live far away."],["keep pace with (rising prices)","(物価の上昇)に追いつく","給料が物価の上昇に追いついていません。","My salary is not keeping pace with rising prices."],["keep up the habit","習慣を続ける、維持する","私は毎朝の散歩の習慣を続けています。","I keep up the habit of walking every morning."],["keep up my English studies","英語の勉強を続ける、維持する","忙しくても、私は英語の勉強を続けています。","I keep up my English studies even when I am busy."],["keep up with (a rapidly changing society)","(急速に変化する社会)についていく","変化の速い社会についていくのは大変です。","It is hard to keep up with a rapidly changing society."],["never gave up on each other","互いを決して諦めなかった","大変な時も、私たちは互いを決して諦めませんでした。","Even in hard times, we never gave up on each other."],["see (things) through to the end","最後までやり遂げる","私はこの計画を最後までやり遂げたいです。","I want to see this plan through to the end."],["stick to (a single career path)","(一つのキャリアパス)に固執する","一つのキャリアパスに固執する必要はありません。","You do not have to stick to a single career path."],["stick with (the same method)","(同じ方法)に固執する","私は毎日、同じ方法で勉強を続けています。","I stick with the same method every day."],["ask for (help)","(助け)を求める","困った時は、助けを求めてください。","Please ask for help when you are in trouble."],["bring about (large-scale change)","(大きな変化)をもたらす","新しい技術は、大きな変化をもたらしました。","New technology has brought about large-scale change."],["carry out (my own plans)","(自分の計画)をやり遂げる","私は自分の計画をやり遂げました。","I carried out my own plans."],["close off (the growth)","(成長)を閉ざす","失敗を恐れると、成長を閉ざしてしまいます。","Fear of failure can close off your growth."],["come (your) way","(運が)巡ってくる","チャンスが巡ってきたら、つかんでください。","When a chance comes your way, take it."],["get away from (daily life)","(日常)から離れる","休みの日は、日常から離れて山に行きます。","On my days off, I get away from daily life and go to the mountains."],["jump into (a new field)","(新しい分野)に飛び込む","私は新しい分野に飛び込みました。","I jumped into a new field."],["move forward","前に進む","失敗しても、前に進みましょう。","Even if you fail, let's move forward."],["open up (new options)","(新しい選択肢)を切り開く","英語を学ぶと、新しい選択肢が開けます。","Learning English opens up new options."],["put (it) into action","(それ)を実行に移す","計画を立てたら、すぐに実行に移しましょう。","Once you make a plan, put it into action right away."],["start from (familiar habits)","(身近な習慣)から始まる","変化は、身近な習慣から始まります。","Change starts from familiar habits."],["start with a small goal","小さな目標から始める","勉強は小さな目標から始めると、続けやすいです。","It is easier to keep going if you start with a small goal."],["start small and build up","小さく始めて、少しずつ積み上げる","私は小さく始めて、少しずつ積み上げています。","I start small and build up little by little."],["switch to (small, achievable goals)","(小さな目標)に切り替える","私は大きな目標を、小さな目標に切り替えました。","I switched to small, achievable goals."],["take on (new challenges)","(新しい挑戦)に取り組む","私は新しい挑戦に取り組みたいです。","I want to take on new challenges."],["take a step forward","一歩踏み出す","勇気を出して、一歩踏み出しました。","I gathered my courage and took a step forward."],["break down (a large task) into (small goals)","(大きな課題)を(小さな目標)に分解する","私は大きな課題を、小さな目標に分解します。","I break down a large task into small goals."],["come up with ideas","アイデアを思いつく","私たちはみんなでアイデアを思いつきました。","We came up with ideas together."],["come up with ways","方法を思いつく","私は勉強を続ける方法を思いつきました。","I came up with ways to keep studying."],["come up with solutions","解決策を思いつく","チームで解決策を思いつきました。","Our team came up with solutions."],["deal with it","それに対処する","その問題には、冷静に対処しましょう。","Let's deal with it calmly."],["deal with climate change","気候変動に対処する","私たちは気候変動に対処する必要があります。","We need to deal with climate change."],["put together (a better event)","(より良いイベント)を作り上げる","私たちは協力して、より良いイベントを作り上げました。","We worked as a team and put together a better event."],["stop to think about (what really matters)","立ち止まって(大切なこと)を考える","私は時々、立ち止まって大切なことを考えます。","Sometimes I stop to think about what really matters."],["talk (it) through carefully","丁寧に話し合う","私たちは、その問題を丁寧に話し合いました。","We talked it through carefully."],["think (things) through together","一緒にじっくり考える","家族で、将来のことを一緒にじっくり考えました。","My family and I thought things through together."],["turn (differences of opinion) into (cooperation)","(意見の違い)を(協力)に変える","意見の違いを、協力に変えることができます。","We can turn differences of opinion into cooperation."],["work out (a way)","(方法)を考え出す","私は、忙しくても勉強できる方法を考え出しました。","I worked out a way to study even when I am busy."],["calm (me) down","(私を)落ち着かせる","音楽を聴くと、気持ちが落ち着きます。","Listening to music calms me down."],["come through (in their cooking)","(料理を通して)表れる、伝わる","その人の優しさは、料理を通して伝わります。","Their kindness comes through in their cooking."],["end up losing","結局、失うことになる","急ぎすぎると、結局、大切なものを失うことになります。","If you rush, you may end up losing something important."],["end up deepening","結局、深めることになる","話し合ううちに、結局、お互いの理解が深まりました。","After talking, we ended up deepening our understanding of each other."],["end up giving up","結局、諦めることになる","無理な計画だと、結局、諦めることになります。","With an unrealistic plan, you may end up giving up."],["feel down","落ち込む","疲れていると、落ち込むことがあります。","I sometimes feel down when I am tired."],["get up (early)","(早く)起きる","私は毎朝、早く起きます。","I get up early every morning."],["grow up","育つ、成長する","私は小さな町で育ちました。","I grew up in a small town."],["lose sight of (the joy of learning)","(学ぶ楽しさ)を見失う","試験ばかり気にすると、学ぶ楽しさを見失います。","If you only think about exams, you lose sight of the joy of learning."],["melt away (stress)","(ストレス)が溶けていく","温泉に入ると、ストレスが溶けていきます。","Stress melts away in a hot spring."],["slow down","ペースを落とす","疲れた時は、ペースを落としましょう。","When you are tired, slow down."],["wake up (early)","(早く)起きる","私は早く起きて、 const SPLIT = 222; // これ未満の番号は「句動詞・熟語」、以上は「名詞句」
const LS_KEY = 'shunkan-eisakubun-v1';

const $ = id => document.getElementById(id);
const st = { range:'all', filter:'all', order:'seq', autoplay:true, rate:0.9, voice:'', cur:0, marks:{} };
st.rate = 1;

function loadState(){
  try{ const s = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (s && typeof s === 'object') Object.assign(st, s); }catch(e){}
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(st)); }catch(e){}
}

/* ---------- 音声 ---------- */
const synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
let voices = [];
function loadVoices(){
  if (!synth) return;
  voices = synth.getVoices().filter(v => /^en[-_]/i.test(v.lang));
  const sel = $('selVoice');
  const keep = st.voice;
  sel.innerHTML = '<option value="">自動(おすすめ)</option>';
  voices.forEach(v => {
    const o = document.createElement('option');
    o.value = v.voiceURI; o.textContent = v.name + ' (' + v.lang + ')';
    sel.appendChild(o);
  });
  sel.value = voices.some(v => v.voiceURI === keep) ? keep : '';
}
function pickVoice(){
  if (st.voice){ const v = voices.find(v => v.voiceURI === st.voice); if (v) return v; }
  const pref = ['Samantha','Google US English','Aria','Jenny','Ava','Allison','Joanna','Karen','Daniel'];
  for (const p of pref){
    const v = voices.find(v => v.name.indexOf(p) >= 0 && /en[-_]US/i.test(v.lang));
    if (v) return v;
  }
  return voices.find(v => /en[-_]US/i.test(v.lang)) || voices[0] || null;
}
function speak(text){
  if (!synth){ toast('この端末・ブラウザは音声の読み上げに対応していません'); return; }
  try{
    if (synth.speaking || synth.pending) synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    const v = pickVoice();
    if (v){ u.voice = v; u.lang = v.lang; }
    u.rate = Number(st.rate) || 1;
    synth.speak(u);
  }catch(e){ toast('音声を再生できませんでした'); }
}
function stopSpeech(){ try{ if (synth) synth.cancel(); }catch(e){} }

/* ---------- 出題キュー ---------- */
let queue = [], pos = 0, revealed = false;

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function buildQueue(keepIdx){
  const q = [];
  for (let i = 0; i < DATA.length; i++){
    if (st.range === 'g0' && i >= SPLIT) continue;
    if (st.range === 'g1' && i < SPLIT) continue;
    const m = st.marks[i] || 0;
    if (st.filter === 'todo' && m === 1) continue;
    if (st.filter === 'again' && m !== 2) continue;
    q.push(i);
  }
  if (st.order === 'random') shuffle(q);
  queue = q;
  pos = 0;
  if (keepIdx != null){
    const at = q.indexOf(keepIdx);
    if (at >= 0) pos = at;
    else if (st.order === 'seq'){
      const nx = q.findIndex(i => i >= keepIdx);
      pos = nx >= 0 ? nx : 0;
    }
  }
}

/* ---------- 表示 ---------- */
function setRevealed(on){
  revealed = on;
  $('answerBox').classList.toggle('revealed', on);
  $('placeholder').hidden = on;
  $('answerContent').hidden = !on;
  $('rowBefore').hidden = on;
  $('rowAfter').hidden = !on;
  $('btnSpeakAns').style.visibility = on ? 'visible' : 'hidden';
}
function setHint(on){
  $('hintBox').hidden = !on;
  $('btnHint').setAttribute('aria-expanded', on ? 'true' : 'false');
  $('btnHint').textContent = on ? '💡 ヒントを隠す' : '💡 ヒント(フレーズ)を見る';
}
function show(){
  stopSpeech();
  const has = queue.length > 0;
  $('cardBody').hidden = !has;
  $('empty').hidden = has;
  $('rowBefore').hidden = !has;
  $('rowAfter').hidden = true;
  if (!has){
    $('pos').textContent = '0 / 0';
    $('barFill').style.width = '0%';
    return;
  }
  const i = queue[pos];
  const d = DATA[i];
  st.cur = i; saveState();
  setHint(false);
  setRevealed(false);
  $('chip').textContent = i < SPLIT ? '句動詞・熟語' : '名詞句';
  $('num').textContent = 'No.' + (i + 1);
  const m = st.marks[i] || 0;
  const s = $('state');
  s.textContent = m === 1 ? '✓ できた' : (m === 2 ? '↺ 復習' : '');
  s.className = 'state' + (m === 1 ? ' ok' : (m === 2 ? ' again' : ''));
  $('ja').textContent = d[2];
  $('en').textContent = d[3];
  $('hintEn').textContent = d[0];
  $('hintJa').textContent = d[1];
  $('pos').textContent = (pos + 1) + ' / ' + queue.length;
  $('barFill').style.width = ((pos + 1) / queue.length * 100) + '%';
  $('card').scrollTop = 0;
}

/* ---------- 操作 ---------- */
function reveal(){
  if (!queue.length || revealed) return;
  setRevealed(true);
  if (st.autoplay) speak(DATA[queue[pos]][3]);
}
function next(){
  if (!queue.length) return;
  if (pos < queue.length - 1){ pos++; show(); return; }
  // 最後まで来たら、条件に合わせて作り直して最初から
  buildQueue(null);
  toast('ひと通り終わりました。最初に戻ります');
  show();
}
function prev(){
  if (!queue.length) return;
  if (pos > 0){ pos--; show(); }
  else toast('最初の問題です');
}
function mark(v){
  if (!queue.length) return;
  st.marks[queue[pos]] = v;
  saveState();
  next();
}

/* ---------- 設定 ---------- */
function refreshStats(){
  let ok = 0, again = 0;
  Object.keys(st.marks).forEach(k => { if (st.marks[k] === 1) ok++; else if (st.marks[k] === 2) again++; });
  $('stats').textContent = 'できた ' + ok + ' / ' + DATA.length + '　・　復習 ' + again;
}
function openSheet(){
  $('selRange').value = st.range; $('selFilter').value = st.filter; $('selOrder').value = st.order;
  $('chkAuto').checked = !!st.autoplay; $('selRate').value = String(st.rate);
  $('selVoice').value = st.voice || '';
  $('inpJump').value = '';
  refreshStats();
  $('backdrop').hidden = false; $('sheet').hidden = false;
}
function closeSheet(){ $('backdrop').hidden = true; $('sheet').hidden = true; }
function applyFilters(){
  st.range = $('selRange').value; st.filter = $('selFilter').value; st.order = $('selOrder').value;
  saveState();
  buildQueue(st.cur);
  show();
}

let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function init(){
  loadState();
  $('maxNum').textContent = DATA.length;
  buildQueue(st.cur);
  loadVoices();
  if (synth){
    if (typeof synth.addEventListener === 'function') synth.addEventListener('voiceschanged', loadVoices);
    else synth.onvoiceschanged = loadVoices;
  }

  $('answerBox').addEventListener('click', reveal);
  $('answerBox').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); reveal(); } });
  $('btnReveal').addEventListener('click', reveal);
  $('btnOk').addEventListener('click', () => mark(1));
  $('btnAgain').addEventListener('click', () => mark(2));
  $('btnPrev').addEventListener('click', prev);
  $('btnSkip').addEventListener('click', next);
  $('btnSpeak').addEventListener('click', e => { e.stopPropagation(); if (queue.length) speak(DATA[queue[pos]][3]); });
  $('btnSpeakAns').addEventListener('click', () => { if (queue.length) speak(DATA[queue[pos]][3]); });
  $('btnHint').addEventListener('click', () => setHint($('hintBox').hidden));
  $('btnSpeakHint').addEventListener('click', () => { if (queue.length) speak(DATA[queue[pos]][0].replace(/\([^)]*\)/g, ' ')); });

  $('btnSettings').addEventListener('click', openSheet);
  $('btnClose').addEventListener('click', closeSheet);
  $('backdrop').addEventListener('click', closeSheet);
  ['selRange','selFilter','selOrder'].forEach(id => $(id).addEventListener('change', applyFilters));
  $('chkAuto').addEventListener('change', e => { st.autoplay = e.target.checked; saveState(); });
  $('selRate').addEventListener('change', e => { st.rate = Number(e.target.value); saveState(); });
  $('selVoice').addEventListener('change', e => { st.voice = e.target.value; saveState(); });
  $('btnTestVoice').addEventListener('click', () => speak('Hello! Let us practice English together.'));
  $('btnJump').addEventListener('click', () => {
    const n = parseInt($('inpJump').value, 10);
    if (!(n >= 1 && n <= DATA.length)){ toast('1〜' + DATA.length + ' の番号を入れてください'); return; }
    st.range = 'all'; st.filter = 'all'; saveState();
    buildQueue(n - 1);
    if (st.order === 'random'){ const at = queue.indexOf(n - 1); if (at >= 0) pos = at; }
    closeSheet(); show();
  });
  $('btnReset').addEventListener('click', () => {
    if (!confirm('「できた」「復習」の記録をすべて消します。よろしいですか?')) return;
    st.marks = {}; saveState(); refreshStats(); buildQueue(st.cur); show(); toast('進捗をリセットしました');
  });

  // スワイプ: 左=スキップ / 右=前へ
  let sx = 0, sy = 0, tracking = false;
  const card = $('card');
  card.addEventListener('touchstart', e => { const t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; tracking = true; }, { passive:true });
  card.addEventListener('touchend', e => {
    if (!tracking) return; tracking = false;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 45){ if (dx < 0) next(); else prev(); }
  }, { passive:true });

  // キーボード(PC用)
  document.addEventListener('keydown', e => {
    const tag = (e.target && e.target.tagName) || '';
    if (/INPUT|SELECT|TEXTAREA|BUTTON/.test(tag) || !$('sheet').hidden) return;
    if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); reveal(); }
    else if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') prev();
    else if (e.key === 'h' || e.key === 'H') setHint($('hintBox').hidden);
    else if ((e.key === 's' || e.key === 'S') && queue.length) speak(DATA[queue[pos]][3]);
  });

  show();

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
init();
</script>
